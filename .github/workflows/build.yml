name: Build LineageOS 20 for ANE-LX1

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Build variant'
        type: choice
        options:
          - userdebug
          - eng
        default: userdebug

jobs:
  build:
    name: Build LineageOS 20
    runs-on: ubuntu-latest
    timeout-minutes: 480
    env:
      USE_CCACHE: 0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/share/swift
          sudo rm -rf /var/lib/apt/lists
          sudo apt-get clean
          df -h

      - name: Install dependencies (Ubuntu 24.04 with i386 support)
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            git python3 openjdk-17-jdk repo bc bison build-essential \
            ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick \
            lib32ncurses-dev lib32readline-dev lib32z1-dev libelf-dev liblz4-tool \
            libncurses-dev libsdl2-dev libssl-dev libxml2 libxml2-utils \
            lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            libc6:i386 libstdc++6:i386 libncurses6:i386 libreadline8:i386

      - name: Configure git
        run: |
          git config --global user.name "GitHub Actions Builder"
          git config --global user.email "actions@github.com"

      - name: Create directories
        run: |
          mkdir -p ~/android/lineage

      - name: Initialize repo
        run: |
          cd ~/android/lineage
          repo init -u https://github.com/LineageOS/android.git -b lineage-20.0 --depth=1

      - name: Copy local manifests
        run: |
          mkdir -p ~/android/lineage/.repo/local_manifests
          cp -r ${{ github.workspace }}/local_manifests/* ~/android/lineage/.repo/local_manifests/

      - name: Sync sources
        run: |
          cd ~/android/lineage
          repo sync -j$(nproc) --force-sync --no-clone-bundle --no-tags --optimized-fetch
          df -h ~

      - name: Free disk after sync (keep working tree, drop git store)
        run: |
          rm -rf ~/android/lineage/.repo
          df -h ~

      - name: Create swap space (avoid runner OOM kill during soong analysis)
        run: |
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
          df -h ~

      - name: Build LineageOS
        run: |
          cd ~/android/lineage
          source build/envsetup.sh
          lunch lineage_anne-${{ github.event.inputs.variant }}
          mka bacon -j$(nproc) || {
            echo "=== BUILD FAILED ===";
            free -h;
            df -h;
            exit 1;
          }
          echo "=== BUILD OK ==="
          free -h
          df -h ~

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lineage-20-anne-${{ github.event.inputs.variant }}
          path: ~/android/lineage/out/target/product/anne/lineage-20-*-UNOFFICIAL-anne.zip
          retention-days: 7
